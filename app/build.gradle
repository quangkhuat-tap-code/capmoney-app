plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.comgroupcapmoney'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.comgroupcapmoney"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Retrofit & Gson (Gọi API Node.js)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // Glide (Load & Bo góc ảnh, chống tràn RAM)
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Room Database (Cache offline cho Member 3)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // MPAndroidChart (Vẽ biểu đồ Donut cho Member 3)
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}